<div class="stats-grid"{% if value.animate %} data-count-up{% endif %} data-reveal>
    {% for item in value.items %}
    <div class="stat">
        <p class="stat__value"><span data-count-to="{{ item.value }}">{% if value.animate %}0{% else %}{{ item.value }}{% endif %}</span>{% if item.suffix %}<span class="stat__suffix">{{ item.suffix }}</span>{% endif %}</p>
        <p class="stat__label">{{ item.label }}</p>
    </div>
    {% endfor %}
</div>
