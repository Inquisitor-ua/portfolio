{% load wagtailcore_tags %}
<section class="section section--bg-{{ value.background }}"{% if value.anchor %} id="{{ value.anchor }}"{% endif %} data-reveal>
    <div class="container container--{{ value.width }}">
        {% if value.eyebrow or value.heading or value.intro %}
        <div class="section__head section__head--{{ value.align }}">
            {% if value.eyebrow %}<p class="eyebrow">{{ value.eyebrow }}</p>{% endif %}
            {% if value.heading %}<h2 class="section__title">{{ value.heading }}</h2>{% endif %}
            {% if value.intro %}<div class="section__intro prose">{{ value.intro }}</div>{% endif %}
        </div>
        {% endif %}
        <div class="section__content">
            {% include_block value.content %}
        </div>
    </div>
</section>
