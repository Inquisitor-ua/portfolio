# Host-level nginx site config for yehor-inq.com.
#
# This runs as the system nginx (installed via apt), NOT inside Docker — it
# is the single process on the server that binds 80/443 and fans requests
# out to every project by domain (see deploy/README.md for the full
# picture, including how crossword.yehor-inq.com fits in).
#
# Install:
#   sudo cp deploy/nginx/yehor-inq.com.conf /etc/nginx/sites-available/yehor-inq.com.conf
#   sudo ln -s /etc/nginx/sites-available/yehor-inq.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d yehor-inq.com -d www.yehor-inq.com
# certbot will rewrite the "listen 443" block below automatically.

upstream portfolio {
    server 127.0.0.1:8001;
}

server {
    listen 80;
    listen [::]:80;
    server_name yehor-inq.com www.yehor-inq.com;

    client_max_body_size 25M;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Wagtail-uploaded files. Static assets are served by WhiteNoise from
    # inside gunicorn, so nginx only needs filesystem access to media/.
    location /media/ {
        alias /srv/portfolio/media/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://portfolio;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
